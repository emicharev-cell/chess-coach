<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chess Coach: GM Training</title>
  <meta name="description" content="Grandmaster-level chess training: opening repertoires for 1.e4 and 1.d4, middlegame patterns, endgame technique and spaced-repetition drills that build automatic responses.">

  <link rel="icon" href="img/pieces/wN.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/"><img src="img/pieces/wN.svg" alt="" class="logo"><span>Chess Coach<small data-i18n="GM training">GM training</small></span></a>
      <nav class="nav">
        <a href="#/" data-route=""><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="Home">Home</span></a>
        <a href="#/learn" data-route="learn"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h7"/></svg><span data-i18n="Learn">Learn</span></a>
        <a href="#/drill" data-route="drill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg><span data-i18n="Drill">Drill</span></a>
        <a href="#/puzzles" data-route="puzzles"><svg viewBox="0 0 24 24"><path d="M9 3h6v3a2 2 0 1 0 0 4v0h3v4h-3a2 2 0 1 0-4 0H8v-4a2 2 0 1 1 0-4h1z"/><path d="M8 14v7h10v-7"/></svg><span data-i18n="Puzzles">Puzzles</span></a>
        <a href="#/play" data-route="play"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg><span data-i18n="Play">Play</span></a>
        <a href="#/library" data-route="library"><svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.5 4.5l3-.8 3.5 15.4-3 .8z"/></svg><span data-i18n="Library">Library</span></a>
      </nav>
      <div class="side-foot">
        <div class="lang-switch" data-i18n-title="Language"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
        <div class="board-themes" data-i18n-title="Board colours">
          <button data-board="brown" aria-label="Brown board"></button>
          <button data-board="green" aria-label="Green board"></button>
          <button data-board="blue" aria-label="Blue board"></button>
        </div>
        <div class="side-btns">
          <button class="icon-btn" data-set="sound" data-i18n-title="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6"/></svg></button>
          <button class="icon-btn" data-set="theme" data-i18n-title="Light / dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
